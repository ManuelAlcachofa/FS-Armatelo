<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarme — Armatelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="nav">
    <div class="container nav__row">
      <a href="index.html" class="nav__brand">ARMA<span>TELO</span></a>
      <ul class="nav__links">
        <li><a href="index.html#builds">Builds</a></li>
        <li><a href="ensamble.html">Ensamblar</a></li>
        <li><a href="ayuda.html">Ayuda</a></li>
      </ul>
      <a href="registro.html" class="nav__cta">Registrarme</a>
      <button class="nav__toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    </div>
  </header>

  <main>
    <section class="auth">
      <div class="auth__card">
        <p class="section__eyebrow">Cuenta nueva</p>
        <h1 class="panel__title" style="margin-top:6px;">Crea tu cuenta</h1>
        <p class="panel__desc">Guarda tus builds y vuelve a armar cuando quieras.</p>

        <form id="form-registro" novalidate>
          <div class="field">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" autocomplete="name" required />
          </div>

          <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="new-password" required />
          </div>

          <div class="field">
            <label for="confirmar-password">Confirmar contraseña</label>
            <input type="password" id="confirmar-password" name="confirmar-password" autocomplete="new-password" required />
            <span class="field__error" id="error-confirmar-password"></span>
          </div>

          <button type="submit" class="btn btn--primary auth__submit">Crear cuenta</button>
        </form>

        <p class="auth__foot">¿Ya tienes cuenta? <a href="#" style="color: var(--ember-glow);">Inicia sesión</a></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__row" style="display:flex; align-items:center; justify-content:space-between; width:100%; flex-wrap:wrap; gap:12px;">
      <span class="footer__brand">ARMATELO</span>
      <span>&copy; <span data-year></span> Armatelo. Proyecto académico.</span>
    </div>
  </footer>

  <script src="main.js"></script>
  <script src="validacion.js"></script>
</body>
</html>
